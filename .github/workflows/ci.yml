name: Test Workflow

on:
    push:
        branches:
            - master
    pull_request:
        branches: [ master ]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
          - uses: actions/checkout@v6

          - name: flake8 lint
            run: |
                cd backend/
                pip install flake8==7.3.0
                flake8 .

          - name: eslint
            run: |
                cd frontend/
                npm install --save-dev eslint@9 @eslint/js globals eslint-plugin-vue vue-eslint-parser
                npm run lint

    test:
        runs-on: ubuntu-latest
        needs: lint

        steps:
          - uses: actions/checkout@v6

          - name: cache pip requirements
            uses: actions/setup-python@v5
            with:
                python-version: '3.11'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'

          - name: cache npm packages
            uses: actions/cache@v5
            with:
                path: frontend/node_modules
                key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}

          - name: install python requirements
            run:
                pip install -r backend/requirements.txt

          - name: install npm packages
            run: |
                cd frontend/
                npm install --legacy-peer-deps

          - name: pytest
            run: |
                cd backend/
                pytest


    build:
        runs-on: ubuntu-latest
        needs: test

        steps:
          - uses: actions/checkout@v6

          - name: build-backend
            run: |
                cd backend/
                docker build -t back:${{ github.sha }} .
                docker images | grep back

          - name: build-frontend
            run: |
                cd frontend/
                docker build -t front:${{ github.sha }} .
                docker images | grep front